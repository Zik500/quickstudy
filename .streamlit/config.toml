# QuickStudy theme: clean white with a soft purple accent
[theme]
base = "light"
primaryColor = "#7C3AED"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F6FA"
textColor = "#111827"
borderColor = "#E5E7EB"
baseRadius = "12px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"

[theme.sidebar]
backgroundColor = "#FFFFFF"

[client]
toolbarMode = "minimal"
